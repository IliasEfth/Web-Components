name: shop-backoffice

services:
  mock-api:
    build:
      context: tools/mock-api
      dockerfile: Dockerfile.dev
    networks:
      - shop-network
    develop:
      watch:
        - action: sync+restart
          path: tools/mock-api/src
          target: /app/src
        - action: rebuild
          path: tools/mock-api/package.json
        - action: rebuild
          path: tools/mock-api/db.seed.json

  web-components-basics:
    build:
      context: examples/web-components-basics
      dockerfile: Dockerfile.dev
    ports:
      - '4100:80'
    networks:
      - edge
    develop:
      watch:
        - action: sync
          path: examples/web-components-basics
          target: /usr/share/nginx/html
          ignore:
            - node_modules/
            - Dockerfile.dev
            - nginx.conf
            - eslint.config.js
            - package.json
            - package-lock.json
        - action: rebuild
          path: examples/web-components-basics/nginx.conf

  orders:
    build:
      context: .
      dockerfile: apps/microfrontends/orders/Dockerfile.dev
    networks:
      - shop-network
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/microfrontends/orders/src
          target: /repo/apps/microfrontends/orders/src
        - action: rebuild
          path: apps/microfrontends/orders/package.json
        - action: rebuild
          path: tools/mock-api/contract
        - action: rebuild
          path: apps/microfrontends/orders/contract
        - action: rebuild
          path: apps/microfrontends/orders/angular.json
        - action: rebuild
          path: apps/microfrontends/orders/federation.config.mjs

  insights:
    build:
      context: .
      dockerfile: apps/microfrontends/insights/Dockerfile.dev
    networks:
      - shop-network
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/microfrontends/insights/src
          target: /repo/apps/microfrontends/insights/src
        - action: sync
          path: apps/microfrontends/insights/index.html
          target: /repo/apps/microfrontends/insights/index.html
        - action: rebuild
          path: apps/microfrontends/insights/package.json
        - action: rebuild
          path: tools/mock-api/contract
        - action: rebuild
          path: apps/microfrontends/insights/contract
        - action: rebuild
          path: apps/microfrontends/insights/vite.config.ts

  notes:
    build:
      context: .
      dockerfile: apps/microfrontends/notes/Dockerfile.dev
    networks:
      - shop-network
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/microfrontends/notes/src
          target: /repo/apps/microfrontends/notes/src
        - action: sync
          path: apps/microfrontends/notes/index.html
          target: /repo/apps/microfrontends/notes/index.html
        - action: rebuild
          path: apps/microfrontends/notes/package.json
        - action: rebuild
          path: tools/mock-api/contract
        - action: rebuild
          path: apps/microfrontends/notes/contract
        - action: rebuild
          path: apps/microfrontends/notes/vite.config.ts

  backoffice-react:
    build:
      context: .
      dockerfile: apps/backoffices/backoffice-react/Dockerfile.dev
    networks:
      - shop-network
    depends_on:
      mock-api:
        condition: service_healthy
      orders:
        condition: service_healthy
      insights:
        condition: service_healthy
      notes:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/backoffices/backoffice-react/src
          target: /repo/apps/backoffices/backoffice-react/src
        - action: sync
          path: apps/backoffices/backoffice-react/index.html
          target: /repo/apps/backoffices/backoffice-react/index.html
        - action: rebuild
          path: apps/backoffices/backoffice-react/package.json
        - action: rebuild
          path: apps/microfrontends/orders/contract
        - action: rebuild
          path: apps/microfrontends/insights/contract
        - action: rebuild
          path: apps/microfrontends/notes/contract
        - action: rebuild
          path: apps/backoffices/backoffice-react/vite.config.ts

  backoffice-vue:
    build:
      context: .
      dockerfile: apps/backoffices/backoffice-vue/Dockerfile.dev
    networks:
      - shop-network
    depends_on:
      mock-api:
        condition: service_healthy
      orders:
        condition: service_healthy
      insights:
        condition: service_healthy
      notes:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/backoffices/backoffice-vue/src
          target: /repo/apps/backoffices/backoffice-vue/src
        - action: sync
          path: apps/backoffices/backoffice-vue/index.html
          target: /repo/apps/backoffices/backoffice-vue/index.html
        - action: rebuild
          path: apps/backoffices/backoffice-vue/package.json
        - action: rebuild
          path: apps/microfrontends/orders/contract
        - action: rebuild
          path: apps/microfrontends/insights/contract
        - action: rebuild
          path: apps/microfrontends/notes/contract
        - action: rebuild
          path: apps/backoffices/backoffice-vue/vite.config.ts

  backoffice-angular16:
    build:
      context: .
      dockerfile: apps/backoffices/backoffice-angular16/Dockerfile.dev
    networks:
      - shop-network
    depends_on:
      mock-api:
        condition: service_healthy
      orders:
        condition: service_healthy
      insights:
        condition: service_healthy
      notes:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/backoffices/backoffice-angular16/src
          target: /repo/apps/backoffices/backoffice-angular16/src
        - action: rebuild
          path: apps/backoffices/backoffice-angular16/package.json
        - action: rebuild
          path: apps/microfrontends/orders/contract
        - action: rebuild
          path: apps/microfrontends/insights/contract
        - action: rebuild
          path: apps/microfrontends/notes/contract
        - action: rebuild
          path: apps/backoffices/backoffice-angular16/angular.json

  backoffice-react-proxy:
    build:
      context: apps/backoffices/backoffice-react/proxy
      dockerfile: Dockerfile.dev
    ports:
      - '4200:80'
    networks:
      - edge
      - shop-network
    depends_on:
      backoffice-react:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: apps/backoffices/backoffice-react/proxy/nginx.conf

  backoffice-vue-proxy:
    build:
      context: apps/backoffices/backoffice-vue/proxy
      dockerfile: Dockerfile.dev
    ports:
      - '4400:80'
    networks:
      - edge
      - shop-network
    depends_on:
      backoffice-vue:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: apps/backoffices/backoffice-vue/proxy/nginx.conf

  backoffice-angular16-proxy:
    build:
      context: apps/backoffices/backoffice-angular16/proxy
      dockerfile: Dockerfile.dev
    ports:
      - '4500:80'
    networks:
      - edge
      - shop-network
    depends_on:
      backoffice-angular16:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: apps/backoffices/backoffice-angular16/proxy/nginx.conf

networks:
  edge:
    name: shop-edge
  shop-network:
    name: shop-network
    internal: true
