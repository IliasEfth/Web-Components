name: shop-backoffice

services:
  mock-api:
    build:
      context: tools/mock-api
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    develop:
      watch:
        - action: sync+restart
          path: tools/mock-api/src
          target: /app/src
        - action: rebuild
          path: tools/mock-api/package.json
        - action: rebuild
          path: tools/mock-api/db.seed.json

  web-components-basics:
    build:
      context: examples/web-components-basics
      dockerfile: Dockerfile.dev
    ports:
      - '4100:80'
    develop:
      watch:
        - action: sync
          path: examples/web-components-basics
          target: /usr/share/nginx/html
          ignore:
            - node_modules/
            - Dockerfile.dev
            - nginx.conf
            - eslint.config.js
            - package.json
            - package-lock.json
        - action: rebuild
          path: examples/web-components-basics/nginx.conf

  orders:
    build:
      context: apps/orders
      dockerfile: Dockerfile.dev
    ports:
      - '4201:4201'
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/orders/src
          target: /app/src
        - action: rebuild
          path: apps/orders/package.json
        - action: rebuild
          path: apps/orders/angular.json
        - action: rebuild
          path: apps/orders/federation.config.mjs

  insights:
    build:
      context: apps/insights
      dockerfile: Dockerfile.dev
    ports:
      - '4202:4202'
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/insights/src
          target: /app/src
        - action: sync
          path: apps/insights/index.html
          target: /app/index.html
        - action: rebuild
          path: apps/insights/package.json
        - action: rebuild
          path: apps/insights/vite.config.ts
