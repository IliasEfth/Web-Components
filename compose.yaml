name: shop-backoffice

services:
  mock-api:
    build:
      context: tools/mock-api
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    develop:
      watch:
        - action: sync+restart
          path: tools/mock-api/src
          target: /app/src
        - action: rebuild
          path: tools/mock-api/package.json
        - action: rebuild
          path: tools/mock-api/db.seed.json

  web-components-basics:
    build:
      context: examples/web-components-basics
      dockerfile: Dockerfile.dev
    ports:
      - '4100:80'
    develop:
      watch:
        - action: sync
          path: examples/web-components-basics
          target: /usr/share/nginx/html
          ignore:
            - node_modules/
            - Dockerfile.dev
            - nginx.conf
            - eslint.config.js
            - package.json
            - package-lock.json
        - action: rebuild
          path: examples/web-components-basics/nginx.conf

  orders:
    build:
      context: apps/microfrontends/orders
      dockerfile: Dockerfile.dev
    ports:
      - '4201:4201'
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/microfrontends/orders/src
          target: /app/src
        - action: rebuild
          path: apps/microfrontends/orders/package.json
        - action: rebuild
          path: apps/microfrontends/orders/angular.json
        - action: rebuild
          path: apps/microfrontends/orders/federation.config.mjs

  insights:
    build:
      context: apps/microfrontends/insights
      dockerfile: Dockerfile.dev
    ports:
      - '4202:4202'
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/microfrontends/insights/src
          target: /app/src
        - action: sync
          path: apps/microfrontends/insights/index.html
          target: /app/index.html
        - action: rebuild
          path: apps/microfrontends/insights/package.json
        - action: rebuild
          path: apps/microfrontends/insights/vite.config.ts

  notes:
    build:
      context: apps/microfrontends/notes
      dockerfile: Dockerfile.dev
    ports:
      - '4402:4402'
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/microfrontends/notes/src
          target: /app/src
        - action: sync
          path: apps/microfrontends/notes/index.html
          target: /app/index.html
        - action: rebuild
          path: apps/microfrontends/notes/package.json
        - action: rebuild
          path: apps/microfrontends/notes/vite.config.ts

  backoffice-react:
    build:
      context: apps/backoffices/backoffice-react
      dockerfile: Dockerfile.dev
    ports:
      - '4200:4200'
    depends_on:
      mock-api:
        condition: service_healthy
      orders:
        condition: service_healthy
      insights:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/backoffices/backoffice-react/src
          target: /app/src
        - action: sync
          path: apps/backoffices/backoffice-react/index.html
          target: /app/index.html
        - action: rebuild
          path: apps/backoffices/backoffice-react/package.json
        - action: rebuild
          path: apps/backoffices/backoffice-react/vite.config.ts

  backoffice-vue:
    build:
      context: apps/backoffices/backoffice-vue
      dockerfile: Dockerfile.dev
    ports:
      - '4400:4400'
    depends_on:
      mock-api:
        condition: service_healthy
      orders:
        condition: service_healthy
      insights:
        condition: service_healthy
      notes:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/backoffices/backoffice-vue/src
          target: /app/src
        - action: sync
          path: apps/backoffices/backoffice-vue/index.html
          target: /app/index.html
        - action: rebuild
          path: apps/backoffices/backoffice-vue/package.json
        - action: rebuild
          path: apps/backoffices/backoffice-vue/vite.config.ts

  backoffice-angular16:
    build:
      context: apps/backoffices/backoffice-angular16
      dockerfile: Dockerfile.dev
    ports:
      - '4500:4500'
    depends_on:
      mock-api:
        condition: service_healthy
      orders:
        condition: service_healthy
      insights:
        condition: service_healthy
      notes:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/backoffices/backoffice-angular16/src
          target: /app/src
        - action: rebuild
          path: apps/backoffices/backoffice-angular16/package.json
        - action: rebuild
          path: apps/backoffices/backoffice-angular16/angular.json
