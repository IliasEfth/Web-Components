name: shop-services

services:
  mock-api:
    build:
      context: apps/services/mock-api
      dockerfile: Dockerfile.dev
    networks:
      - shop-network
    develop:
      watch:
        - action: sync+restart
          path: apps/services/mock-api/src
          target: /app/src
        - action: rebuild
          path: apps/services/mock-api/package.json
        - action: rebuild
          path: apps/services/mock-api/db.seed.json

networks:
  shop-network:
    name: shop-network
    internal: true
