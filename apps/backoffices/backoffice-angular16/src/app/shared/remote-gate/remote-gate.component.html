<ng-container [ngSwitch]="state">
  <ng-container *ngSwitchCase="'ready'">
    <ng-container *ngTemplateOutlet="content"></ng-container>
  </ng-container>

  <section *ngSwitchCase="'loading'" class="card remote-card">Loading {{ name }}…</section>

  <section *ngSwitchCase="'failed'" class="card remote-card remote-card--failed" role="alert">
    <h2>{{ name }} is unavailable</h2>
    <p>The rest of the back office keeps working.</p>
    <p class="remote-card__error">{{ message }}</p>
    <button type="button" class="button" (click)="retry()">Retry</button>
  </section>
</ng-container>
