<p class="intro">
  The shell never calls the API: the statistics come from Insights, the open orders from Orders.
  Open an order to see its detail.
</p>

<div class="stack">
  <app-remote-gate name="Insights" [load]="loadInsights">
    <ng-template>
      <shop-order-stats></shop-order-stats>
    </ng-template>
  </app-remote-gate>

  <app-remote-gate name="Orders" [load]="loadOrders">
    <ng-template>
      <shop-orders-list
        status="open"
        page-size="5"
        (orderSelected)="orderSelected($event)"
      ></shop-orders-list>
    </ng-template>
  </app-remote-gate>
</div>
