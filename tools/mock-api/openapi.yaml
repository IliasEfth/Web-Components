openapi: 3.1.0
info:
  title: Shop Back Office API
  version: 1.0.0
  description: Orders and their notes. The clients in clients/ follow this file.
servers:
  - url: http://localhost:3000
paths:
  /orders:
    get:
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatusFilter'
      responses:
        '200':
          description: The orders, filtered by status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
  /orders/{id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      responses:
        '200':
          description: One order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateOrderStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: The updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/notes:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: listOrderNotes
      responses:
        '200':
          description: The notes of one order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: addOrderNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        '201':
          description: The new note
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: A-1001
  schemas:
    OrderStatus:
      type: string
      enum: [open, shipped]
    OrderStatusFilter:
      type: string
      enum: [all, open, shipped]
    Order:
      type: object
      required: [id, customer, total, status, createdAt]
      properties:
        id:
          type: string
        customer:
          type: string
        total:
          type: number
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date
    Note:
      type: object
      required: [id, orderId, text, createdAt]
      properties:
        id:
          type: integer
        orderId:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  responses:
    BadRequest:
      description: The request is not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The order does not exist
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
