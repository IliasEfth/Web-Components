map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map "$http_sec_fetch_site:$http_sec_fetch_mode" $api_from_front {
  default 0;
  'same-origin:cors' 1;
  'same-origin:same-origin' 1;
}

server {
  listen 80;
  listen [::]:80;

  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location /api/ {
    if ($api_from_front = 0) {
      return 403;
    }
    limit_except GET POST PATCH {
      deny all;
    }
    set $api http://mock-api:3000;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api;
  }

  location /orders/ {
    set $orders http://orders:4201;
    proxy_pass $orders;
  }

  location /insights/ {
    set $insights http://insights:4202;
    proxy_pass $insights;
  }

  location /notes/ {
    set $notes http://notes:4402;
    proxy_pass $notes;
  }

  location /react/ {
    set $react http://backoffice-react:4200;
    proxy_pass $react;
  }

  location /vue/ {
    set $vue http://backoffice-vue:4400;
    proxy_pass $vue;
  }

  location /angular16/ {
    set $angular16 http://backoffice-angular16:4500;
    proxy_pass $angular16;
  }

  location / {
    set $basics http://web-components-basics:80;
    proxy_pass $basics;
  }
}
