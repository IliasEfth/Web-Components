name: shop-backoffice

services:
  mock-api:
    build: tools/mock-api
    ports:
      - '3000:3000'
    develop:
      watch:
        - action: sync+restart
          path: tools/mock-api/src
          target: /app/src
        - action: rebuild
          path: tools/mock-api/package.json
        - action: rebuild
          path: tools/mock-api/db.seed.json

  web-components-basics:
    build: examples/web-components-basics
    ports:
      - '4100:80'
    develop:
      watch:
        - action: sync
          path: examples/web-components-basics
          target: /usr/share/nginx/html
          ignore:
            - node_modules/
            - Dockerfile
            - nginx.conf
            - eslint.config.js
            - package.json
            - package-lock.json
        - action: rebuild
          path: examples/web-components-basics/nginx.conf

  orders:
    build: apps/orders
    ports:
      - '4201:4201'
    depends_on:
      mock-api:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: apps/orders/src
          target: /app/src
        - action: rebuild
          path: apps/orders/package.json
        - action: rebuild
          path: apps/orders/angular.json
