name: shop-basics

services:
  web-components-basics:
    build:
      context: examples/web-components-basics
      dockerfile: Dockerfile.dev
    ports:
      - '4100:80'
    develop:
      watch:
        - action: sync
          path: examples/web-components-basics
          target: /usr/share/nginx/html
          ignore:
            - node_modules/
            - Dockerfile.dev
            - nginx.conf
            - eslint.config.js
            - package.json
            - package-lock.json
        - action: rebuild
          path: examples/web-components-basics/nginx.conf
