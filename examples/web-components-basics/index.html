<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Web Components basics</title>
    <link rel="stylesheet" href="./demo.css" />
    <script type="module" src="./components/user-card.js"></script>
    <script type="module" src="./components/counter-button.js"></script>
    <script type="module" src="./components/todo-list.js"></script>
    <script type="module" src="./demo.js"></script>
  </head>
  <body>
    <h1>Web Components basics</h1>

    <section>
      <h2>1. Set a value with an attribute</h2>
      <user-card id="card" name="Maria" role="Designer"></user-card>
      <div class="controls">
        <input id="name-input" placeholder="Type a new name" aria-label="New name" />
      </div>
    </section>

    <section>
      <h2>2. Listen to an event from a component</h2>
      <counter-button id="likes" label="Likes" start="5"></counter-button>
      <p id="log">Click the button.</p>
    </section>

    <section>
      <h2>3. Call a method on a component</h2>
      <todo-list id="todos" heading="Shopping"></todo-list>
      <div class="controls">
        <button id="add-milk" type="button">Add "Milk" from the page</button>
      </div>
    </section>
  </body>
</html>
